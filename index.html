<!DOCTYPE html>
<html lang="ca">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Helpdesk TIC · Flor de Maig</title>
<script>document.documentElement.dataset.theme=localStorage.getItem('tic_theme')||(matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light')</script>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<script src="https://accounts.google.com/gsi/client" async defer></script>
<style>
:root{--brand:#82212d;--brand2:#a4b10a;/* colors corporatius */
--onbrand:#fff;--bg:#f4f6f9;--card:#fff;--ink:#1f2933;--mut:#66727f;--line:#dde3ea;--acc:var(--brand);--onacc:#fff;--soft:#f6e8ea;--ok:#1d7a4d;--warn:#b35c00;--bad:#c62828}
:root[data-theme=dark]{--bg:#12100f;--card:#1d1a1a;--ink:#ece8e8;--mut:#a59d9d;--line:#33292b;--acc:#c2d02e;--onacc:#1e2203;--soft:#3a2328;--ok:#5fd09a;--warn:#ffb15c;--bad:#ff8a80;--brand:#5c1620}
*{box-sizing:border-box}[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 'Atkinson Hyperlegible',system-ui,sans-serif}
header{background:var(--brand);color:var(--onbrand);border-bottom:4px solid var(--brand2);padding:10px 16px;display:flex;gap:12px;align-items:center;position:sticky;top:0;z-index:5}
header b{font-size:1.1rem;white-space:nowrap}
input,select,textarea,button{font:inherit;color:inherit;padding:8px 10px;border:1px solid var(--line);border-radius:6px;background:var(--card);width:100%}
header input{flex:1;color:var(--ink)}
button{background:var(--acc);color:var(--onacc);border:0;font-weight:700;cursor:pointer;width:auto;white-space:nowrap}
button.sec{background:transparent;color:var(--acc);border:1px solid var(--line)}
header button{background:var(--brand2);color:#1f2933}header button.sec{background:transparent;color:var(--onbrand);border:1px solid #fff8}
:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.logo{display:block;width:56px;padding:6px;border-radius:8px}
:root[data-theme=dark] .logo{background:#fff}
#login{max-width:380px;margin:12vh auto;text-align:center;background:var(--card);border:1px solid var(--line);border-top:4px solid var(--brand2);border-radius:10px;padding:28px}
#login .logo{width:90px;margin:0 auto 8px}
#gbtn{display:flex;justify-content:center;margin:16px 0}
.wrap{display:grid;grid-template-columns:210px 1fr;gap:16px;max-width:1100px;margin:16px auto;padding:0 16px}
nav{display:flex;flex-direction:column;gap:2px}
nav .logo{margin-bottom:8px}
nav button{background:transparent;color:var(--ink);text-align:left;font-weight:400;display:flex;justify-content:space-between;width:100%;padding:9px 12px}
nav button.on{background:var(--soft);color:var(--acc);font-weight:700}
nav .n{color:var(--mut)}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:14px}
.stat{border-top:3px solid var(--brand2);background:var(--card);border-radius:8px;padding:10px 14px;border-left:1px solid var(--line);border-right:1px solid var(--line);border-bottom:1px solid var(--line)}
.stat b{font-size:1.6rem;display:block;line-height:1.2}
.list{background:var(--card);border:1px solid var(--line);border-radius:8px}
.r{display:grid;grid-template-columns:50px 1fr 120px 90px 110px;gap:10px;padding:11px 14px;border-top:1px solid var(--line);cursor:pointer;align-items:center}
.r:first-child{border-top:0}.r:hover{background:var(--soft)}
.r small,.meta{color:var(--mut);font-size:.88rem}
.Alta{--c:var(--bad)}.Mitjana{--c:var(--warn)}.Baixa{--c:var(--ok)}
.pri::before{content:"";display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px;background:var(--c)}
.badge{padding:1px 10px;border-radius:99px;border:1px solid currentColor;font-size:.82rem;font-weight:700;justify-self:start}
.Obert{color:var(--bad)}.En\ curs{color:var(--warn)}.Resolt{color:var(--ok)}
dialog{border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);width:min(640px,94vw);max-height:90vh;padding:18px}
dialog::backdrop{background:#0008}
label{display:block;font-weight:700;margin:10px 0 4px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.msg{border-left:3px solid var(--line);padding:4px 12px;margin:10px 0}.msg.tic{border-color:var(--brand2);background:var(--soft)}
.adm{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:10px 0}
#fab{position:fixed;right:16px;bottom:16px;z-index:6;border-radius:99px;padding:12px 18px;background:var(--brand2);color:#1f2933;box-shadow:0 2px 8px #0005}
#chat{position:fixed;right:16px;bottom:16px;z-index:7;width:min(340px,calc(100vw - 32px));height:min(460px,75vh);background:var(--card);border:1px solid var(--line);border-top:4px solid var(--brand2);border-radius:10px;display:flex;flex-direction:column;box-shadow:0 4px 16px #0006}
#chat>div:first-child{padding:10px 12px;display:flex;justify-content:space-between;align-items:center}
#cmsg{flex:1;overflow:auto;padding:0 12px}
.b{padding:8px 10px;border-radius:10px;margin:6px 0;max-width:88%;white-space:pre-wrap}
.b.u{background:var(--soft);margin-left:auto}.b.a{background:var(--bg);border:1px solid var(--line)}
#chat form{display:flex;gap:6px;padding:10px}
@media(max-width:700px){.wrap{grid-template-columns:1fr}nav{flex-direction:row;overflow-x:auto;align-items:center}nav .logo{display:none}nav button{width:auto}.stats{grid-template-columns:repeat(2,1fr)}.r{grid-template-columns:40px 1fr 90px}.r>:nth-child(3),.r>:nth-child(5){display:none}header #who{display:none}}
</style>
</head>

   const CFG={SCRIPT_URL:'https://script.google.com/macros/s/XXXXX/exec',CLIENT_ID:'1234-abcd.apps.googleusercontent.com'};

const $=s=>document.querySelector(s);
let tok=sessionStorage.getItem('tic_tok')||'',me=null,tickets=[],view='Tots',cur=null,hist=[];
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

const VIEWS={'Tots':t=>true,'Oberts':t=>t.estat==='Obert','En curs':t=>t.estat==='En curs','Resolts':t=>t.estat==='Resolt','Urgents':t=>t.prioritat==='Alta'&&t.estat!=='Resolt'};

async function api(b){const r=await fetch(CFG.SCRIPT_URL,{method:'POST',headers:{'Content-Type':'text/plain'},body:JSON.stringify({...b,token:tok})});return r.json()}
function showLogin(m){$('#app').hidden=true;$('#login').hidden=false;$('#lmsg').textContent=m||''}
function initGsi(){
  if(!CFG.SCRIPT_URL||!CFG.CLIENT_ID){showLogin('Falta configurar SCRIPT_URL i CLIENT_ID a index.html.');return}
  if(!window.google||!google.accounts){setTimeout(initGsi,300);return}
  google.accounts.id.initialize({client_id:CFG.CLIENT_ID,hd:'flordemaig.cat',auto_select:true,callback:r=>{tok=r.credential;sessionStorage.setItem('tic_tok',tok);load()}});
  google.accounts.id.renderButton($('#gbtn'),{theme:'outline',size:'large',locale:'ca'});
}
async function load(){
  if(!tok){showLogin();return}
  try{
    const d=await api({action:'list'});
    if(!d.ok){tok='';sessionStorage.removeItem('tic_tok');showLogin(d.error==='auth'?'Cal un compte @flordemaig.cat o tornar a iniciar la sessió.':'Error: '+d.error);return}
    me=d.me;tickets=d.tickets;$('#who').textContent=me.name;$('#fab').hidden=!d.chat||!$('#chat').hidden;
    $('#login').hidden=true;$('#app').hidden=false;render();
  }catch(e){showLogin('No s\'ha pogut connectar. Torna-ho a provar.')}
}

  $('#items').innerHTML=l.length?l.map(t=>`<div class="r" tabindex="0" onclick="openT(${t.id})" onkeydown="if(event.key==='Enter')openT(${t.id})">
    <small>#${t.id}</small><div><b>${esc(t.assumpte)}</b><br><small>${esc(t.professor)} · ${esc(t.espai)} · ${fd(t.data)}</small></div>
    <span class="pri ${esc(t.prioritat)}">${esc(t.prioritat)}</span><span class="badge ${esc(t.estat)}">${esc(t.estat)}</span>
    <small>${esc(t.assignat)||'Sense assignar'}</small></div>`).join(''):'<p style="padding:14px" class="meta">No hi ha cap ticket en aquesta vista.</p>';
}
function openT(id){
  cur=tickets.find(t=>t.id==id);const t=cur;
  const sel=(k,o)=>`<select id="f-${k}" aria-label="${k}">${o.map(x=>`<option${x===t[k]?' selected':''}>${x}</option>`).join('')}</select>`;
  dDet.innerHTML=`<h2>#${t.id} · ${esc(t.assumpte)}</h2>
  <p class="meta">${esc(t.professor)} · ${esc(t.espai)} · ${esc(t.categoria)} · ${fd(t.data)}</p><p>${esc(t.descripcio)}</p>
  ${me.tic?`<div class="adm">${sel('estat',['Obert','En curs','Resolt'])}${sel('prioritat',['Baixa','Mitjana','Alta'])}<input id="f-assignat" aria-label="Assignat a" placeholder="Assignat a" value="${esc(t.assignat)}"></div><p><button onclick="saveT()">Desa canvis</button></p>`:''}
  ${(t.fils||[]).map(m=>`<div class="msg ${m.tic?'tic':''}"><small>${esc(m.autor)}${m.tic?' (TIC)':''} · ${fd(m.data)}</small><br>${esc(m.text)}</div>`).join('')||'<p class="meta">Encara no hi ha respostes.</p>'}
  <label for="rep">Resposta</label><textarea id="rep" rows="3"></textarea>
  <p><button onclick="reply()">Envia resposta</button> <button class="sec" onclick="dDet.close()">Tanca</button></p>`;
  dDet.showModal();
}
async function saveT(){
  const d=await api({action:'update',id:cur.id,estat:$('#f-estat').value,prioritat:$('#f-prioritat').value,assignat:$('#f-assignat').value});
  if(!d.ok){alert(d.error);return}dDet.close();load();
}
async function reply(){
  const text=$('#rep').value.trim();if(!text)return;
  await api({action:'comment',id:cur.id,text});dDet.close();await load();openT(cur.id);
}
$('#new').onclick=()=>{$('#msg').textContent='';dNew.showModal()};
$('#send').onclick=async()=>{
  const b={action:'create',assumpte:$('#ass').value.trim(),espai:$('#espai').value.trim(),categoria:$('#cat').value,prioritat:$('#pri').value,descripcio:$('#desc').value.trim()};
  if(!b.assumpte||!b.descripcio){$('#msg').textContent='Omple l\'assumpte i la descripció.';return}
  $('#send').disabled=true;$('#msg').textContent='Enviant…';
  try{const d=await api(b);if(!d.ok)throw 0;dNew.close();$('#ass').value=$('#desc').value='';load()}
  catch(e){$('#msg').textContent='No s\'ha pogut enviar. Torna-ho a provar.'}
  $('#send').disabled=false;
};
$('#out').onclick=()=>{tok='';sessionStorage.removeItem('tic_tok');if(window.google&&google.accounts)google.accounts.id.disableAutoSelect();showLogin('Has tancat la sessió.')};
$('#q').oninput=render;

/* xat d'ajuda */
function bub(r,t){const d=document.createElement('div');d.className='b '+r;d.textContent=t;$('#cmsg').append(d);$('#cmsg').scrollTop=1e9}
$('#fab').onclick=()=>{$('#chat').hidden=false;$('#fab').hidden=true;if(!hist.length)bub('a','Hola! Explica\'m quin problema tens i et proposaré uns passos. Si no es resol, crea un ticket.');$('#ci').focus()};
$('#cx').onclick=()=>{$('#chat').hidden=true;$('#fab').hidden=false};
$('#cf').onsubmit=async e=>{
  e.preventDefault();const t=$('#ci').value.trim();if(!t)return;$('#ci').value='';bub('u',t);hist.push({role:'user',content:t});
  bub('a','…');const w=$('#cmsg').lastChild;
  try{const d=await api({action:'chat',messages:hist});w.textContent=d.ok?d.text:(d.error||'Error');if(d.ok)hist.push({role:'assistant',content:d.text})}
  catch(x){w.textContent='No s\'ha pogut connectar.'}
};

/* tema clar/fosc */
const setTh=t=>{document.documentElement.dataset.theme=t;localStorage.setItem('tic_theme',t);$('#themeBtn').textContent=t==='dark'?'Mode clar':'Mode fosc'};
$('#themeBtn').onclick=()=>setTh(document.documentElement.dataset.theme==='dark'?'light':'dark');
setTh(document.documentElement.dataset.theme);

if(tok&&CFG.SCRIPT_URL)load();else showLogin();
window.addEventListener('load',initGsi);
</script>
</body>
</html>
